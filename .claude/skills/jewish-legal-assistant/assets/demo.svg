<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="640" rx="18" fill="#f4f6fa"/>

  <!-- RIGHT: the photographed ticket (fictional data from test scenario 1) -->
  <g transform="rotate(2 1000 300)">
    <rect x="830" y="70" width="330" height="470" rx="10" fill="#fffdf3" stroke="#c9b98b" stroke-width="2"/>
    <rect x="830" y="70" width="330" height="58" rx="10" fill="#c0392b"/>
    <text x="1145" y="108" text-anchor="start" direction="rtl" font-size="22" font-weight="bold" fill="#fff">הודעת תשלום קנס – חניה</text>
    <g font-size="19" fill="#333" text-anchor="start" direction="rtl">
      <text x="1140" y="165">עיריית תל אביב-יפו</text>
      <text x="1140" y="205">מספר דוח: 40012345</text>
      <text x="1140" y="245">15.10.2026 ‏· 09:40</text>
      <text x="1140" y="285">רחוב הדוגמה 10</text>
      <text x="1140" y="325">חניה בסימון אדום-לבן</text>
      <text x="1140" y="365">רכב: 12-345-67</text>
      <text x="1140" y="420" font-size="34" font-weight="bold" fill="#c0392b">250 ₪</text>
    </g>
    <text x="995" y="510" text-anchor="middle" font-size="16" fill="#8a7a50">📷 צולם בטלפון</text>
  </g>

  <!-- arrow -->
  <g>
    <line x1="805" y1="305" x2="705" y2="305" stroke="#1d4e89" stroke-width="6" stroke-linecap="round"/>
    <polygon points="690,305 715,290 715,320" fill="#1d4e89"/>
    <text x="755" y="285" text-anchor="middle" font-size="16" fill="#1d4e89">Claude</text>
  </g>

  <!-- LEFT: the action card from the real answer -->
  <rect x="40" y="40" width="640" height="560" rx="16" fill="#ffffff" stroke="#d5dce8" stroke-width="2"/>
  <rect x="40" y="40" width="640" height="64" rx="16" fill="#fff4e5"/>
  <text x="660" y="81" text-anchor="start" direction="rtl" font-size="22" font-weight="bold" fill="#b35c00">⚠️ לפני הכול: אל תשלמו "ליתר ביטחון"</text>

  <text x="660" y="145" text-anchor="start" direction="rtl" font-size="20" fill="#333">מסלול: בקשה לביטול לעירייה</text>
  <text x="660" y="185" text-anchor="start" direction="rtl" font-size="26" font-weight="bold" fill="#0f2742">🗓️ עד 17.11.2026 (יום שלישי)</text>

  <text x="660" y="240" text-anchor="start" direction="rtl" font-size="20" font-weight="bold" fill="#333">הטענות, עם ציון:</text>
  <g font-size="19" direction="rtl" text-anchor="start">
    <rect x="70" y="258" width="590" height="46" rx="10" fill="#e8f6ec"/>
    <text x="645" y="288" fill="#1e7b3c">הסימון האדום-לבן כמעט מחוק</text>
    <text x="95" y="288" text-anchor="start" direction="ltr" font-weight="bold" fill="#1e7b3c">חזקה</text>
    <rect x="70" y="314" width="590" height="46" rx="10" fill="#fff7e0"/>
    <text x="645" y="344" fill="#9a6b00">ספרה אחת שגויה במספר הרכב</text>
    <text x="95" y="344" text-anchor="start" direction="ltr" font-weight="bold" fill="#9a6b00">בינונית</text>
    <rect x="70" y="370" width="590" height="46" rx="10" fill="#f1f1f1"/>
    <text x="645" y="400" fill="#777">"זה היה רק דקה"</text>
    <text x="95" y="400" text-anchor="start" direction="ltr" font-weight="bold" fill="#777">סוננה</text>
  </g>

  <text x="660" y="460" text-anchor="start" direction="rtl" font-size="19" fill="#333">📸 עכשיו: לצלם את הסימון באור יום, עם תאריך ושעה</text>
  <rect x="70" y="490" width="590" height="80" rx="12" fill="#0f2742"/>
  <text x="645" y="530" text-anchor="start" direction="rtl" font-size="21" font-weight="bold" fill="#fff">✉️ מכתב ביטול מלא, מוכן להדבקה</text>
  <text x="645" y="557" text-anchor="start" direction="rtl" font-size="16" fill="#cfe0f5">לכבוד עיריית תל אביב-יפו · הנדון: בקשה לביטול דוח 40012345</text>
</svg>
